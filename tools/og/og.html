<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>og</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700&family=JetBrains+Mono:wght@400;500&display=block">
<style>
  html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; }
  body {
    background:
      radial-gradient(120% 70% at 50% 125%, rgba(140, 59, 21, 0.55), transparent 60%),
      radial-gradient(60% 45% at 50% 115%, rgba(232, 131, 58, 0.22), transparent 70%),
      #0c0a09;
    color: #eadcc5;
    font-family: "JetBrains Mono", Consolas, monospace;
    position: relative;
  }
  canvas { position: absolute; inset: 0; }
  .wrap { position: absolute; inset: 0; display: flex; align-items: center; gap: 64px; padding: 0 96px; }
  .sigil {
    width: 250px; height: 250px; flex: none; border-radius: 50%;
    display: grid; place-items: center;
    background: radial-gradient(circle at 50% 60%, #241911, #0f0c0a 70%);
    box-shadow: 0 0 0 1px rgba(234, 220, 197, 0.14), 0 0 80px -10px rgba(232, 131, 58, 0.55);
  }
  .sigil svg { width: 150px; height: 150px; }
  .eyebrow { font-size: 22px; letter-spacing: 4px; color: #9b8d78; text-transform: uppercase; margin: 0 0 14px; }
  .eyebrow b { color: #e8833a; font-weight: 500; }
  h1 { font-family: "Cinzel", serif; font-weight: 700; font-size: 70px; line-height: 1; margin: 0; white-space: nowrap; text-shadow: 0 0 40px rgba(232, 131, 58, 0.25); }
  .role { font-size: 30px; margin: 24px 0 0; }
  .role i { font-style: normal; color: #e8833a; }
  .sql { font-size: 21px; color: #9b8d78; margin: 30px 0 0; }
  .sql .k { color: #e8833a; }
  .url { position: absolute; right: 56px; bottom: 40px; font-size: 20px; color: #9b8d78; text-shadow: 0 0 6px #0c0a09, 0 0 12px #0c0a09; }
</style>
</head>
<body>
<canvas id="c" width="1200" height="630"></canvas>
<div class="wrap">
  <div class="sigil">
    <svg viewBox="0 0 64 64" aria-hidden="true">
      <defs>
        <linearGradient id="flame" x1="0" y1="1" x2="0" y2="0">
          <stop offset="0" stop-color="#8c3b15"/><stop offset="0.6" stop-color="#e8833a"/><stop offset="1" stop-color="#f6c48a"/>
        </linearGradient>
      </defs>
      <path d="M32 6c3 7 9 10 9 18 0 4-2 7-4 8 1-4-1-7-3-8 0 5-4 6-4 11 0 2 1 3 2 4-4-1-7-4-7-9 0-9 7-12 7-24z" fill="url(#flame)"/>
      <g fill="none" stroke="#eadcc5" stroke-width="1.6" stroke-linecap="round">
        <ellipse cx="32" cy="40" rx="15" ry="4.5"/>
        <path d="M17 40v8c0 2.5 6.7 4.5 15 4.5s15-2 15-4.5v-8"/>
        <path d="M17 48v6c0 2.5 6.7 4.5 15 4.5s15-2 15-4.5v-6" opacity="0.55"/>
      </g>
    </svg>
  </div>
  <div>
    <p class="eyebrow"><b>●</b> instance PTRAVESSO · open</p>
    <h1>Pablo Travesso</h1>
    <p class="role">Oracle DBA <i>·</i> PostgreSQL <i>·</i> MySQL</p>
    <p class="sql"><span class="k">SELECT</span> channel <span class="k">FROM</span> pablo.links;</p>
  </div>
</div>
<div class="url">ptravesso-dba.github.io</div>
<script>
  // a fixed, seeded scatter of embers with schema-graph links (deterministic so the image is stable)
  var c = document.getElementById("c").getContext("2d"), s = 7, pts = [];
  function r() { s = (s * 16807) % 2147483647; return s / 2147483647; }
  for (var i = 0; i < 70; i++) pts.push({ x: r() * 1200, y: r() * 630, rad: 0.8 + r() * 1.8, h: 0.5 + r() * 0.5 });
  c.lineWidth = 0.8;
  for (i = 0; i < pts.length; i++) for (var j = i + 1; j < pts.length; j++) {
    var dx = pts[i].x - pts[j].x, dy = pts[i].y - pts[j].y, d = Math.sqrt(dx * dx + dy * dy);
    if (d < 140) { c.strokeStyle = "rgba(234,220,197," + (0.12 * (1 - d / 140)) + ")"; c.beginPath(); c.moveTo(pts[i].x, pts[i].y); c.lineTo(pts[j].x, pts[j].y); c.stroke(); }
  }
  pts.forEach(function (p) {
    var R = 200 + 50 * p.h, G = 70 + 120 * p.h * p.h, B = 25 + 70 * p.h * p.h * p.h;
    c.fillStyle = "rgba(" + (R | 0) + "," + (G | 0) + "," + (B | 0) + ",0.16)"; c.beginPath(); c.arc(p.x, p.y, p.rad * 4, 0, 7); c.fill();
    c.fillStyle = "rgba(" + (R | 0) + "," + (G | 0) + "," + (B | 0) + ",0.85)"; c.beginPath(); c.arc(p.x, p.y, p.rad, 0, 7); c.fill();
  });
</script>
</body>
</html>
